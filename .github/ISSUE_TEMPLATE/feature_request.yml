name: Feature request
description: An idea for Perspica.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. English or Japanese is fine. Please wait for a reply before you write code for a new feature.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How should it work, from the user's side?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
