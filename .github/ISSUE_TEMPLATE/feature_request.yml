name: Feature request
description: An idea for Perspica.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Requests are welcome in English or Japanese.
        Describe the problem and proposed behavior below. Please wait for a reply before writing code for a new feature.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What should the user be able to do, and what should happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
